name: Fetch Nikkansports RSS

on:
  schedule:
    - cron: '0 21 * * *'  # JST 6:00（UTCで前日21:00）
  workflow_dispatch:

jobs:
  run-fetcher:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up credentials.json
        run: echo "${{ secrets.GOOGLE_CREDENTIALS }}" > credentials.json

      - name: Run main.py
        run: python main.py
