name: Yahoo! Sports Navi Scraper (5-23時のみ実行)

on:
  schedule:
    # JST 5:17〜23:17 → UTC 20:17(前日)〜14:17(当日)。毎時0分はGitHub側が混んで遅延・スキップが多いので17分にずらしている
    - cron: '17 20-23 * * *'  # 前日20時〜23時（JST翌日5時〜8時）
    - cron: '17 0-14 * * *'   # 当日0時〜14時（JST9時〜23時）
  workflow_dispatch:  # 手動実行可能

jobs:
  run-yahoo-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decode Google Sheets credentials
        run: |
          echo "${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}" | base64 -d > credentials.json
          echo "✅ credentials.json created successfully"
          ls -la credentials.json

      - name: Run Yahoo! Sports Navi scraper
        run: python main_yahoo_sponavi.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload logs as artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-yahoo-${{ github.run_number }}
          path: "*.log"
          retention-days: 1 