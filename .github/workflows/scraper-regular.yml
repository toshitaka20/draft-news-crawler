name: Regular News Scraper (5 Sources)

on:
  schedule:
    # 毎時0分はGitHub側が混んで遅延・スキップが多いので47分にずらしている
    - cron: '47 0 * * *'  # JST 9:47（UTCで0:47）
    - cron: '47 6 * * *'  # JST 15:47（UTCで6:47）
    - cron: '47 12 * * *' # JST 21:47（UTCで12:47）
  workflow_dispatch:  # 手動実行可能

jobs:
  run-regular-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decode Google Sheets credentials
        run: |
          echo "${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}" | base64 -d > credentials.json
          echo "✅ credentials.json created successfully"
          ls -la credentials.json

      - name: Run regular news scraper (5 sources)
        run: python main_regular.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload SQL files as artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sql-files-regular-${{ github.run_number }}
          path: sql_output/
          retention-days: 7

      - name: Upload logs as artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-regular-${{ github.run_number }}
          path: "*.log"
          retention-days: 3 