name: Regular News Scraper (5 Sources)

on:
  schedule:
    - cron: '0 0 * * *'  # JST 9:00（UTCで0:00）
    - cron: '0 6 * * *'  # JST 15:00（UTCで6:00）
    - cron: '0 12 * * *' # JST 21:00（UTCで12:00）
  workflow_dispatch:  # 手動実行可能

jobs:
  run-regular-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decode Google Sheets credentials
        run: |
          echo "${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}" | base64 -d > credentials.json
          echo "✅ credentials.json created successfully"
          ls -la credentials.json

      - name: Run regular news scraper (5 sources)
        run: python main_regular.py
        env:
          GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload SQL files as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-files-regular-${{ github.run_number }}
          path: sql_output/
          retention-days: 7

      - name: Upload logs as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-regular-${{ github.run_number }}
          path: "*.log"
          retention-days: 3 